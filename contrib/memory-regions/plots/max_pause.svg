<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 235" font-size="13">
<rect width="960" height="235" fill="#fcfcfb"/>
<text x="40" y="30" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#0b0b0b" font-weight="bold">The longest pause any event took</text>
<line x1="40" y1="50" x2="62" y2="50" stroke="#2a78d6" stroke-width="3" stroke-linecap="round"/>
<text x="68" y="54" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#0b0b0b">stock collector</text>
<line x1="182.0" y1="50" x2="204.0" y2="50" stroke="#eb6834" stroke-width="3" stroke-linecap="round"/>
<text x="210.0" y="54" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#0b0b0b">regions, census every 100 k</text>
<line x1="410.4" y1="50" x2="432.4" y2="50" stroke="#1baf7a" stroke-width="3" stroke-linecap="round"/>
<text x="438.4" y="54" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#0b0b0b">regions, no census</text>
<line x1="220.0" y1="80" x2="220.0" y2="195" stroke="#e8e7e4" stroke-width="1"/>
<text x="220.0" y="215" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#52514e" text-anchor="middle">10 µs</text>
<line x1="440.0" y1="80" x2="440.0" y2="195" stroke="#e8e7e4" stroke-width="1"/>
<text x="440.0" y="215" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#52514e" text-anchor="middle">100 µs</text>
<line x1="660.0" y1="80" x2="660.0" y2="195" stroke="#e8e7e4" stroke-width="1"/>
<text x="660.0" y="215" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#52514e" text-anchor="middle">1.0 ms</text>
<line x1="880.0" y1="80" x2="880.0" y2="195" stroke="#e8e7e4" stroke-width="1"/>
<text x="880.0" y="215" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#52514e" text-anchor="middle">10 ms</text>
<text x="204" y="115" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="end">~1.7 KB per event</text>
<circle cx="792.1" cy="110" r="7" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="792.1" y="96" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="middle">4 ms</text>
<circle cx="382.7" cy="110" r="7" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
<text x="382.7" y="96" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="middle">55 µs</text>
<circle cx="259.4" cy="110" r="7" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/>
<text x="259.4" y="96" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="middle">15 µs</text>
<text x="204" y="175" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="end">~100 B per event</text>
<circle cx="790.0" cy="170" r="7" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="790.0" y="156" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="middle">4 ms</text>
<circle cx="376.3" cy="170" r="7" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
<text x="376.3" y="156" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="middle">51 µs</text>
<circle cx="261.6" cy="170" r="7" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/>
<text x="261.6" y="156" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="middle">15 µs</text>
</svg>